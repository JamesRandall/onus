# The released compiler (docs/onus-impl-spec-v0.md M15.5): on a version tag,
# every platform builds `onus` from bootstrap/ — the compiler in Onus as
# JavaScript, which carries its runtime — with node and clang as build-time
# dependencies only, checks the binary against the example from a bare
# directory with no node on its path, and the release collects one archive
# per platform. The tag must name the root package's version. Windows waits
# on the C runtime's port (item 181).
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-14
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install clang and z3 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang z3
      - name: Install z3 (macOS)
        if: runner.os == 'macOS'
        run: brew install z3
      - name: Restore the proof cache
        uses: actions/cache@v4
        with:
          path: self/.onus/cache
          key: proofs-${{ runner.os }}-${{ hashFiles('self/**/*.onus', 'packages/stdlib/std/*.onus', 'packages/compiler/test/**/*.onus', 'examples/**/*.onus') }}
          restore-keys: |
            proofs-${{ runner.os }}-
      - name: The tag names the package's version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME is not v$version"; exit 1; }
      - name: Build onus from bootstrap/
        run: node bootstrap/run_cli.js build self/cli.onus --target native --out dist-native --root self --stdlib packages/stdlib --budget 3000
      - name: Smoke test from a bare directory, with no node on the path
        run: |
          set -e
          version=$(node -p "require('./package.json').version")
          home=$(mktemp -d)
          cp examples/mandelbrot/mandelbrot.onus "$home/"
          exe=$PWD/dist-native/native/cli
          # A path holding clang and z3 alone (Homebrew keeps node beside z3), and the system's directories.
          bin=$(mktemp -d)
          ln -s "$(command -v clang)" "$bin/clang"
          ln -s "$(command -v z3)" "$bin/z3"
          bare=$bin:/usr/bin:/bin
          cd "$home"
          env PATH="$bare" sh -c 'command -v node' && { echo "node is still on the path"; exit 1; }
          test "$(env PATH="$bare" "$exe" --version)" = "onus $version"
          env PATH="$bare" "$exe" check mandelbrot.onus
          env PATH="$bare" "$exe" build mandelbrot.onus --out out --target native
          mkdir run && cd run && ../out/native/mandelbrot && test -s mandelbrot.pgm
      - name: Package
        run: |
          version=$(node -p "require('./package.json').version")
          name=onus-$version-${{ matrix.target }}
          mkdir -p "pkg/$name"
          cp dist-native/native/cli "pkg/$name/onus"
          cp LICENSE README.md "pkg/$name/"
          cp packages/runtime/native/blake3/LICENSE_A2 "pkg/$name/LICENSE-BLAKE3"
          tar -C pkg -czf "$name.tar.gz" "$name"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: onus-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the release with one archive per platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "onus $GITHUB_REF_NAME" --generate-notes artifacts/*.tar.gz
  # The Homebrew tap (item 182): `brew install JamesRandall/onus/compiler`. The formula is
  # rendered from the archives' checksums and pushed to JamesRandall/homebrew-onus with a
  # token that can write there (the secret HOMEBREW_TAP_TOKEN); without the secret the
  # step is skipped and the formula is updated by hand with scripts/brew-formula.sh.
  tap:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Render the formula
        run: |
          version=$(node -p "require('./package.json').version")
          scripts/brew-formula.sh "$version" artifacts > compiler.rb
          ruby -c compiler.rb
      - name: Push the formula to the tap
        if: env.TAP_TOKEN != ''
        run: |
          version=$(node -p "require('./package.json').version")
          git clone "https://x-access-token:$TAP_TOKEN@github.com/JamesRandall/homebrew-onus.git" tap
          mkdir -p tap/Formula
          cp compiler.rb tap/Formula/compiler.rb
          cd tap
          git config user.name "onus release"
          git config user.email "release@onus-lang.org"
          git add Formula/compiler.rb
          git diff --cached --quiet || git commit -m "compiler $version"
          git push
      - name: No tap token, so the formula is attached to the run instead
        if: env.TAP_TOKEN == ''
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: compiler.rb
