# The gates of docs/onus-impl-spec-v0.md and .claude/skills/language-change/SKILL.md
# on every push and pull request: the packages build, the bootstrap chain to
# its fixed point with the native stage, and the fixture suite under the
# chain's stage2 with the native compiler for the release case. z3 is
# installed so obligations are proved as they are locally; the proof caches
# are kept between runs, keyed by the sources they were computed from.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # A node whose ICU carries Unicode 16.0, the version §19.1 pins, so the
          # comparison of the native text tables with the host runs (item 181).
          node-version: 22.13.0
          cache: pnpm
      - name: Install clang and z3
        run: sudo apt-get update && sudo apt-get install -y clang z3
      - name: Restore the proof caches
        uses: actions/cache@v4
        with:
          path: |
            self/.onus/cache
            .onus-tmp/fixtures/cache
          key: proofs-${{ runner.os }}-${{ hashFiles('self/**/*.onus', 'packages/stdlib/std/*.onus', 'test/**/*.onus', 'examples/**/*.onus') }}
          restore-keys: |
            proofs-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Bootstrap chain, fixed point and native stage
        run: scripts/bootstrap.sh
      - name: The fixture suite under stage2, the release case with the native compiler
        run: ONUS_FIXTURES=.onus-tmp/bootstrap/stage2/run_fixtures.js ONUS_NATIVE_CLI=.onus-tmp/bootstrap/native/native/cli scripts/fixtures.sh
